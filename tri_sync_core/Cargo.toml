[package]
name = "tri_sync_core"
version = "0.1.0"
edition = "2021"
description = "Pure consensus logic (fusion, trust, clarity gate, chain, Ed25519 signing, epoch rotation) for tri-sync-consensus-lab - no networking or file I/O."
license-file = "../LICENSE.md"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
