[package]
name = "tri-sync-consensus-lab"
version = "0.1.0"
edition = "2021"
description = "Simulation testbed for trust-weighted sensor fusion and block-based agreement across noisy, adversarial-free nodes; telemetry-instrumented, not yet cryptographically secured."
publish = false

[lib]
name = "tri_sync"
path = "src/lib.rs"

[[bin]]
name = "sim"
path = "src/bin/sim.rs"

[[bin]]
name = "sim_chain_basic"
path = "src/bin/sim_chain_basic.rs"

[[bin]]
name = "sim_chain_reconcile"
path = "src/bin/sim_chain_reconcile.rs"

[[bin]]
name = "sim_chain_signed"
path = "src/bin/sim_chain_signed.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[dependencies]
rand = "0.8"
rand_distr = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
tiny_http = "0.12"
