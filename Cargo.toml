[workspace]
members = ["tri_sync_core", "tri_sync_node"]

[package]
name = "tri_sync"
version = "0.2.0"
edition = "2021"
description = "Simulation testbed for trust-weighted sensor fusion and block-based agreement across noisy, adversarial nodes; telemetry-instrumented. One variant adds real Ed25519 signing and epoch key rotation."
license-file = "LICENSE.md"
publish = false

[lib]
name = "tri_sync"
path = "src/lib.rs"

[[bin]]
name = "tri_sync_scalar"
path = "src/main.rs"

[[bin]]
name = "tri_sync_graph"
path = "src/bin/tri_sync_graph.rs"

[[bin]]
name = "tri_sync_chain"
path = "src/bin/tri_sync_chain.rs"

[[bin]]
name = "tri_sync_chain_weighted"
path = "src/bin/tri_sync_chain_weighted.rs"

[[bin]]
name = "tri_sync_chain_crypto"
path = "src/bin/tri_sync_chain_crypto.rs"

[[bin]]
name = "tri_sync_http"
path = "src/bin/tri_sync_http.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_distr = "0.4"
sha2 = "0.10"
hex = "0.4"
tiny_http = "0.12"
ed25519-dalek = { version = "2", features = ["rand_core"] }
